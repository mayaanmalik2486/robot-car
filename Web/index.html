<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070B1A">
<title>Robot Car</title>
<link rel="icon" href="../App/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070B1A; --bg2: #101A3A; --text: #F4F6FF; --label: #9AA6D0; --faint: #5B678F;
  --accent: #FF7A1A; --accent2: #FFB52E; --cyan: #2EE6D6; --stop: #FF3B5C;
  --glass: rgba(255,255,255,.07); --line: rgba(255,255,255,.12);
  --font: "Archivo", "Bahnschrift", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.2, .7, .1, 1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-stretch: 78%; overflow: hidden;
  user-select: none; -webkit-user-select: none; touch-action: none; }

/* ---------- the background: a deep night sky with slow bubbles ---------- */
#bg { position: fixed; inset: 0; overflow: hidden; z-index: 0;
  background: radial-gradient(120% 90% at 50% 110%, #1B2A6B 0%, rgba(27,42,107,0) 60%), radial-gradient(70% 60% at 85% -10%, rgba(255,122,26,.20), rgba(255,122,26,0) 70%),
    radial-gradient(60% 55% at 8% 0%, rgba(46,230,214,.14), rgba(46,230,214,0) 70%), linear-gradient(#070B1A, #0B1230); }
#bg i { position: absolute; bottom: -22vmin; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.55) 0 6%, rgba(255,255,255,.10) 18%, hsla(var(--h),95%,62%,.14) 55%, hsla(var(--h),95%,62%,.05) 70%);
  box-shadow: inset 0 0 0 1px hsla(var(--h),95%,75%,.22); animation: float var(--d) linear infinite; animation-delay: var(--w); }
@keyframes float { 0% { transform: translate3d(0,0,0) scale(.85); opacity: 0; } 8% { opacity: .9; } 50% { transform: translate3d(var(--x), -62vh, 0) scale(1); }
  92% { opacity: .7; } 100% { transform: translate3d(calc(var(--x) * -0.6), -128vh, 0) scale(1.12); opacity: 0; } }

#screen { position: fixed; inset: 0; z-index: 1; }
#screen > * { position: absolute; }
#screen > .rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.96); } }

/* ---------- keys: glass bubbles you can press ---------- */
.key { position: relative; border: 0; margin: 0; padding: 0 8px 3px; color: var(--text); font: 700 15px/1.05 var(--font); font-stretch: 72%; letter-spacing: .04em;
  text-transform: uppercase; cursor: pointer; border-radius: 16px; overflow: hidden; isolation: isolate;
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.26), inset 0 0 0 1px rgba(255,255,255,.07), 0 4px 0 rgba(3,6,18,.8), 0 14px 24px -10px rgba(0,0,0,.7);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  transition: transform .28s var(--spring), box-shadow .2s var(--ease), filter .2s; }
.key::before { content: ""; position: absolute; left: 3px; right: 3px; top: 2px; height: 46%; border-radius: 14px 14px 60% 60% / 14px 14px 26% 26%;
  background: linear-gradient(rgba(255,255,255,.20), rgba(255,255,255,0)); pointer-events: none; z-index: -1; }
.key:hover { filter: brightness(1.12); }
.key:active, .key.flash { transform: translateY(4px) scale(.96); transition-duration: .06s;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 1px rgba(255,255,255,.07), 0 0 0 rgba(3,6,18,.8), 0 4px 10px -6px rgba(0,0,0,.7); }
.key:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.key > span { white-space: nowrap; }
.key small { display: block; font: 600 9.5px/1 var(--mono); font-stretch: 100%; color: var(--label); letter-spacing: .1em; margin-top: 4px; }
.key.on { color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 2px var(--accent), 0 4px 0 rgba(3,6,18,.8), 0 0 26px -4px var(--accent); }
.key.on small { color: var(--accent2); }

/* coloured bubbles (STOP, dance, kick, horn, turbo, connect) */
.key.c { --c1: hsl(var(--h) 100% 66%); --c2: hsl(var(--h) 92% 50%); --cd: hsl(var(--h) 85% 28%);
  background: linear-gradient(180deg, var(--c1), var(--c2)); backdrop-filter: none; text-shadow: 0 1px 0 rgba(0,0,0,.25);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.6), inset 0 -10px 16px rgba(0,0,0,.16), 0 5px 0 var(--cd), 0 18px 28px -10px hsl(var(--h) 100% 55% / .75); }
.key.c::before { background: linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,0)); }
.key.c:active, .key.c.flash { box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5), inset 0 -6px 12px rgba(0,0,0,.2), 0 0 0 var(--cd), 0 6px 14px -8px hsl(var(--h) 100% 55% / .7); }
.key.c small { color: rgba(255,255,255,.82); }
.key.dark-text { color: #2A1B00; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
.key.stop { font-size: 21px; letter-spacing: .16em; font-weight: 900; }
.key.round { border-radius: 50%; }
.key.round::before { left: 14%; right: 14%; top: 5%; height: 40%; border-radius: 50%; }
.ripple { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: rgba(255,255,255,.55); pointer-events: none;
  animation: ripple .55s var(--ease) forwards; z-index: -1; }
@keyframes ripple { to { transform: scale(14); opacity: 0; } }

/* the mode buttons: a glossy little bubble with the picture, the name under it */
.mode .chip { width: var(--chip, 34px); height: var(--chip, 34px); border-radius: 50%; display: grid; place-items: center; font-size: calc(var(--chip, 34px) * .52); line-height: 1; margin-bottom: calc(var(--chip, 34px) * .14); flex: none;
  background: radial-gradient(circle at 34% 26%, rgba(255,255,255,.75) 0 9%, hsl(var(--h) 100% 70%) 24%, hsl(var(--h) 90% 48%) 78%);
  box-shadow: inset 0 -4px 7px rgba(0,0,0,.22), 0 6px 14px -4px hsl(var(--h) 100% 55% / .8); transition: transform .35s var(--spring); }
.mode:hover .chip { transform: translateY(-2px) scale(1.08) rotate(-6deg); }
.mode.on .chip { animation: pulse 1.1s ease-in-out infinite; }
.mode.on { box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 2px hsl(var(--h) 100% 62%), 0 4px 0 rgba(3,6,18,.8), 0 0 28px -4px hsl(var(--h) 100% 60%); }
.mode.row { flex-direction: row; gap: 8px; } .mode.row .chip { margin: 0; }
@keyframes pulse { 50% { transform: scale(1.14); } }
.badge { position: absolute; top: 5px; left: 6px; font: 600 9.5px/15px var(--mono); font-stretch: 100%; padding: 0 6px; border-radius: 8px; background: rgba(3,6,18,.55); color: var(--label); letter-spacing: 0; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* the tabs: one orange pill slides between them */
#tabtrack { border-radius: 18px; background: rgba(3,6,18,.5); box-shadow: inset 0 1px 0 rgba(0,0,0,.6), inset 0 0 0 1px var(--line); }
#tabglow { border-radius: 14px; background: linear-gradient(180deg, #FF9A3D, #FF6A13); transition: left .38s var(--spring), width .38s var(--spring);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), 0 8px 20px -6px rgba(255,122,26,.8); }
.key.tab { background: none; box-shadow: none; backdrop-filter: none; color: var(--label); font-size: 15px; letter-spacing: .12em; }
.key.tab::before { display: none; }
.key.tab.on { color: #fff; box-shadow: none; text-shadow: 0 1px 0 rgba(0,0,0,.25); }

#song { display: flex; align-items: center; color: var(--label); font: 500 12px var(--mono); font-stretch: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
canvas { display: block; touch-action: none; }
#lcd { border-radius: 22px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line), 0 24px 50px -24px rgba(0,0,0,.9); }
.page { display: none; }
.page.show { display: block; }
.page > * { position: absolute; }
.page.show > .key { animation: pop .42s var(--spring) both; animation-delay: calc(var(--k) * 30ms); }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.8); } }
#radar { border-radius: 18px; }

/* ---------- sheets ---------- */
dialog { background: linear-gradient(180deg, rgba(26,36,78,.96), rgba(12,18,44,.97)); color: var(--text); border: 1px solid var(--line); border-radius: 24px; padding: 0;
  max-width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 32px); width: 100%; font: 500 15px/1.5 var(--font); font-stretch: 88%;
  box-shadow: 0 40px 90px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.14); }
dialog[open] { animation: sheet .34s var(--spring); }
@keyframes sheet { from { opacity: 0; transform: translateY(26px) scale(.93); } }
dialog::backdrop { background: rgba(4,6,16,.66); backdrop-filter: blur(6px); animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
dialog.wide { max-width: calc(100vw - 32px); height: calc(100vh - 32px); }
.sheet { display: flex; flex-direction: column; height: 100%; max-height: calc(100vh - 34px); }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px; }
.sheet header h2 { flex: 1; margin: 0; font: 900 26px/1 var(--font); font-stretch: 66%; letter-spacing: .02em; text-transform: uppercase; }
.sheet .body { overflow: auto; padding: 0 16px 16px; }
.sheet .key { height: 44px; min-width: 88px; padding: 0 16px 3px; }
.section { color: var(--accent2); font: 600 11px var(--mono); font-stretch: 100%; letter-spacing: .18em; margin: 24px 0 8px; }
.card { background: var(--glass); border-radius: 16px; padding: 12px 16px; margin-top: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.card .row { display: flex; align-items: center; gap: 16px; }
.card .row > :first-child { flex: 1; }
.sub { color: var(--label); font-size: 12px; }
.seg { display: flex; gap: 8px; margin-top: 8px; }
.seg .key { flex: 1; height: 48px; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 32px; margin: 4px 0 0; }
.switch { appearance: none; width: 48px; height: 28px; border-radius: 14px; background: rgba(255,255,255,.14); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #B9C2E6); transition: transform .3s var(--spring); }
.switch:checked { background: linear-gradient(90deg, #FF6A13, #FFB52E); }
.switch:checked::after { transform: translateX(20px); }
.val { color: var(--accent2); font: 600 13px var(--mono); }
pre { font: 12px/1.5 var(--mono); font-stretch: 100%; color: #9FF5EA; background: rgba(3,6,18,.6); border-radius: 14px; padding: 12px; margin: 0; white-space: pre-wrap; }
.help p { margin: 0 0 12px; color: #C7CEEC; }
.help b { color: var(--text); }
kbd { font: 600 11px var(--mono); background: rgba(255,255,255,.1); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 7px; padding: 1px 6px; color: var(--text); }
#padCanvas { width: 100%; flex: 1; min-height: 240px; }
.hint { color: var(--label); font-size: 13px; text-align: center; padding: 8px 16px 16px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px) scale(.9); background: rgba(20,28,64,.95); color: var(--text); border: 1px solid var(--line);
  padding: 11px 20px; border-radius: 26px; font: 600 14px var(--font); font-stretch: 88%; box-shadow: 0 18px 40px -10px rgba(0,0,0,.8); opacity: 0;
  transition: opacity .25s, transform .4s var(--spring); pointer-events: none; max-width: calc(100vw - 32px); text-align: center; z-index: 10; }
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.jobs .key { height: 44px; }
@media (prefers-reduced-motion: reduce) { #bg i, .mode.on .chip { animation: none; } #screen > .rise, .page.show > .key, dialog[open] { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="screen" aria-label="Robot Car remote"></div>

<dialog id="settings"><div class="sheet">
  <header><h2>Settings</h2><button class="key" data-close>Done</button></header>
  <div class="body" id="settingsBody"></div>
</div></dialog>

<dialog id="controller" class="wide"><div class="sheet" style="height:100%">
  <header><h2 id="padTitle">Controller</h2>
    <button class="key" id="padShift">LB layer</button><button class="key" id="padRemap">Remap</button><button class="key" id="padReset">Reset</button>
    <button class="key" data-close>Done</button></header>
  <canvas id="padCanvas"></canvas>
  <div class="hint" id="padHint"></div>
</div></dialog>

<dialog id="jobs"><div class="sheet">
  <header><h2 id="jobsTitle">Choose a job</h2><button class="key" data-close>Cancel</button></header>
  <div class="body"><div class="jobs" id="jobsList"></div></div>
</div></dialog>

<dialog id="help"><div class="sheet">
  <header><h2>Robot Car</h2><button class="key" data-close>OK</button></header>
  <div class="body help" id="helpBody"></div>
</div></dialog>

<dialog id="message"><div class="sheet">
  <header><h2 id="msgTitle"></h2><button class="key" data-close>OK</button></header>
  <div class="body" id="msgBody"></div>
</div></dialog>

<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
